[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
